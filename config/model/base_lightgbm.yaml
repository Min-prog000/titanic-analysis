data:
  scaler: MinMaxScaler

model:
  num_leaves: 20
  max_depth: 5
  learning_rate: 0.01
  min_child_samples: 25
  subsample: 0.9
  subsample_freq: 34
  n_estimators: 2000 # num_iterations
  objective: "binary"
  colsample_bytree: 0.8
  reg_alpha: 2.5
  # reg_lambda: 1.55
  random_state: 0
  # early_stopping_round: 10
  verbosity: -1
  metric: "logloss"
  n_jobs: -1
